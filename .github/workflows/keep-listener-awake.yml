# Render's free plan stops a service after 15 minutes without visits. cron-job.org is the main
# pinger (every 10 minutes, on time); this is a backup in case it misses, and its log shows
# whether the listener answered.
name: Keep listener awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visit the listener's status page
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 20 https://offers-hub-listener.onrender.com/
