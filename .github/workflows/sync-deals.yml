# Reads the Telegram channels and publishes deals + images to the gh-pages branch, which
# GitHub Pages serves to the app as offers.json.
#
# Each run catches up, then stays connected for ~50 minutes and publishes new posts as they
# arrive (at most every 6 minutes). The schedule starts the next run; while one runs, the next
# waits in the queue, so coverage stays continuous even when GitHub starts scheduled runs late.
name: Sync deals

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-deals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the published site (previous state)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git clone --depth 1 --branch gh-pages \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
          else
            mkdir site
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Sync and watch channels
        working-directory: backend
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          GITHUB_TOKEN: ${{ github.token }}
          BACKFILL_LIMIT: "100"
          KEEP_DAYS: "7"
        run: python sync_static.py ../site --watch 50
